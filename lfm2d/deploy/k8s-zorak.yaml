# lfm2d — zorak-pinned overlay of k8s.yaml for the tobert.org homelab
# k3s cluster (brak = control plane, zorak = tainted agent node).
# Node facts verified live by the zorak Claude session, 2026-08-10:
# labels role=execution, gpu.vendor=amd, gpu.arch=gfx1151; taint
# homelab.tobert.org/execution=true:NoSchedule (deliberate — zorak
# reboots; brak-destined pods must not drift onto it).
#
# Differences from the generic k8s.yaml, all deliberate:
#   * pinned to zorak via nodeSelector + toleration — nothing schedules
#     onto a tainted node without the toleration, and nothing else has
#     the model files;
#   * models come from a hostPath under /tank — brak's local-path
#     provisioner is node-local to BRAK, so a PVC does not compose with
#     a zorak-pinned pod; hostPath is honest about node-pinned state;
#   * OTLP points at the in-cluster collector brak's session stood up
#     on deploy day (monitoring/otel-collector). The earlier HOST_IP
#     downward-API workaround to zorak's host collector is RETIRED —
#     traces have a cluster home now.
#   * replicas: 1 — replica-scaling is the right lever generally (see
#     k8s.yaml), but pinned to one node the replicas would fight over
#     the same cores; revisit when a second gfx-labeled node exists.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: lfm2d
  namespace: lfm2d   # Amy's pick, 2026-08-10; needs hostPath allowed (no
                     # restricted/baseline PSA) — brak's session creates it
  labels:
    app: lfm2d
spec:
  replicas: 1
  selector:
    matchLabels: { app: lfm2d }
  template:
    metadata:
      labels: { app: lfm2d }
    spec:
      nodeSelector:
        gpu.arch: gfx1151
      tolerations:
        - key: "homelab.tobert.org/execution"
          operator: "Equal"
          value: "true"
          effect: "NoSchedule"
      terminationGracePeriodSeconds: 30
      containers:
        - name: lfm2d
          # brak's LAN gitea registry (plain HTTP, LAN-only by design;
          # zorak's /etc/rancher/k3s/registries.yaml carries the mirror
          # entry, so no imagePullSecret is needed — anonymous pull is
          # allowed and was verified end-to-end 2026-08-11).
          #
          # This replaces `ghcr.io/tobert/lfm2d:latest`, which was never
          # actually published: that push was blocked on a missing
          # `write:packages` scope and a `k3s ctr images import` tarball
          # was used instead. The cluster was therefore running an image
          # that existed ONLY in zorak's containerd, under a name pointing
          # at a registry that would refuse to serve it. Nothing was wrong
          # while the node kept the image, but a reschedule after an image
          # GC — or a zorak rebuild — would have surfaced as ErrImagePull
          # and read as a registry problem rather than a never-published
          # image. GHCR returns "denied" for private AND nonexistent repos
          # by design, so the error would have sent someone hunting for an
          # imagePullSecret that could not exist.
          #
          # A real version, never `:latest`. `:latest` + IfNotPresent is
          # exactly how the situation above went unnoticed for a day.
          # Registry manifest digest for this tag, verified by hashing the
          # served bytes rather than trusting Docker-Content-Digest:
          #   sha256:9259e4c01999ab9360ea4073b20918740944061632aec402bed60b9019924352
          image: 192.168.1.2:3000/amy/lfm2d:0.1.0
          imagePullPolicy: IfNotPresent
          args:
            # kube_ordinal_v8 — accepted by Amy 2026-08-11. v6 remains
            # staged alongside on /tank as the rollback target.
            #
            # Switching checkpoints is NOT one line: v8 speaks a different
            # label vocabulary (informative/situation-normal/data-critical)
            # than v6 (informative/mutating/destructive), so the severe set
            # must move with it. The severe pair below is what the v8
            # evaluation actually resolved — see the
            # `severe_labels_resolved` field in
            # training/cascade/eval_v8_router_raw.json, not a guess from
            # the label names. Mismatched labels do not degrade silently:
            # `cascade::resolve_severe_labels` refuses an unknown label and
            # names it, so /v1/cascade would error on every call.
            - --classifier-dir=/models/kube_ordinal_v8
            - --router-dir=/models/LFM2.5-Encoder-350M-Prompt-Router
            - --cascade-route=shell
            - --cascade-route=k8s
            # ORDER IS SEMANTIC: ascending severity, least severe first.
            # As of 2026-08-11 the cascade ranks by expected ordinal rank,
            # so the Nth severe label here weighs N. Reversing these two
            # lines inverts the ranking, and no error will be raised —
            # the label names are both valid, only their order is wrong.
            # Verify against /v1/cascade output, where a clearly destructive
            # clause must score near the top of the 0..2 range.
            - --cascade-severe-label=situation-normal
            - --cascade-severe-label=data-critical
            - --bind-addr=0.0.0.0:8088
          ports:
            - containerPort: 8088
          env:
            # In-cluster collector, stood up by brak's session 2026-08-10
            # (monitoring/otel-collector, gRPC 4317 + HTTP 4318) — this
            # RETIRES the HOST_IP downward-API workaround that previously
            # lived here; brak had already made this exact change live
            # before our Service update briefly reverted it.
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: "http://otel-collector.monitoring.svc.cluster.local:4317"
            - name: OTEL_SERVICE_NAME
              value: lfm2d
          volumeMounts:
            - { name: models, mountPath: /models, readOnly: true }
          readinessProbe:
            httpGet: { path: /readyz, port: 8088 }
            periodSeconds: 5
            failureThreshold: 1
          livenessProbe:
            httpGet: { path: /healthz, port: 8088 }
            periodSeconds: 10
            failureThreshold: 3
          # /tank is local NVMe-class storage — load is the ~400-660ms/
          # head local-disk case, but the generous budget costs nothing.
          startupProbe:
            httpGet: { path: /readyz, port: 8088 }
            periodSeconds: 10
            failureThreshold: 30
          resources:
            requests:
              # Measured numbers — see k8s.yaml's resources comment.
              # Trivial on zorak (125 GiB), but the kubelet's free-memory
              # arithmetic there is OPTIMISTIC: host-level llama.cpp
              # servers outside k8s can claim 70+ GiB and
              # system-reserved isn't set yet (zorak session's
              # issues.md) — keep honest requests anyway.
              memory: "4Gi"
              cpu: "4"
      volumes:
        - name: models
          hostPath:
            # One subdirectory per checkpoint (config.json +
            # model.safetensors + tokenizer.json), rsync-delivered; the
            # zorak session owns this tree.
            path: /tank/ml/models/lfm2d
            type: Directory
---
apiVersion: v1
kind: Service
metadata:
  name: lfm2d
  namespace: lfm2d
  annotations:
    # Stable tailnet hostname (otherwise the operator derives one from
    # namespace+service): lfm2d.<tailnet>.ts.net via MagicDNS.
    tailscale.com/hostname: "lfm2d"
spec:
  selector: { app: lfm2d }
  ports:
    - port: 8088
      targetPort: 8088
  # Tailscale operator (installed by brak 2026-08-10): lfm2d gets its
  # own tagged tailnet identity — no 0.0.0.0 listener, ACL-targetable.
  # First deploy ran ClusterIP-only until health + weight_hash were
  # verified in-cluster (they were: f740471a… exact match).
  type: LoadBalancer
  loadBalancerClass: tailscale
  # Deliberately ClusterIP (no `type:`) for first deploy: prove the pod
  # healthy and the weight_hash correct from inside the cluster, THEN
  # decide exposure. lfm2d has no auth of its own, and the zorak session
  # audit (2026-08-10) found two things that make exposure a conscious
  # decision, not a default:
  #   1. k3s ServiceLB/NodePort binds 0.0.0.0 — putting `tailscale
  #      serve` in front adds a TLS tailnet path but does NOT close the
  #      LAN listener next to it; "tailnet boundary" via ServiceLB is
  #      decoration unless the port is also firewalled off the LAN NIC.
  #   2. The tailnet has a SECOND user account on it — tailnet-only is
  #      not owner-only for an unauthenticated API.
  # The clean answer stays the Tailscale k8s operator (brak's call):
  #   type: LoadBalancer
  #   loadBalancerClass: tailscale
  # gives lfm2d its own tagged tailnet identity with no 0.0.0.0
  # listener, and tags make it ACL-targetable so access can be
  # restricted per-user. Funnel (public internet) is ruled out.
